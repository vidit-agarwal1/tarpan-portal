{% extends 'accounts/base.html' %}

{% block title %}Admin Login | Tarpan Foundation{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 420px; margin: 4rem auto;">
    <div class="card" style="padding: 2.5rem;">

        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="metric-icon-wrapper info" style="margin: 0 auto 1rem auto;">
                <i data-lucide="shield"></i>
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 700;">Admin Console Login</h2>
            <p class="text-secondary" style="font-size: 0.9rem; margin-top: 0.25rem;">
                Restricted access. Authorised personnel only.
            </p>
        </div>

        {% if error %}
        <div style="background: #fff0f0; border: 1px solid #ffcccc; border-radius: var(--radius-sm); padding: 0.75rem 1rem; margin-bottom: 1.5rem; color: #cc0000; font-size: 0.9rem;">
            <i data-lucide="alert-circle" style="width: 1rem; height: 1rem; vertical-align: middle;"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label style="font-size: 0.85rem; font-weight: 500;">Username</label>
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autofocus
                    required
                >
            </div>

            <div class="form-group">
                <label style="font-size: 0.85rem; font-weight: 500;">Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-full" style="margin-top: 1rem;">
                <i data-lucide="log-in"></i> Login to Console
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{% url 'home' %}" class="text-secondary" style="font-size: 0.85rem; text-decoration: none;">
                ← Back to Home
            </a>
        </div>

    </div>
</div>
{% endblock %}
