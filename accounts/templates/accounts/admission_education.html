{% extends 'accounts/base.html' %}

{% block title %}Educational Details | Admission Form{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 650px; margin: 0 auto;">
    
    <!-- Progress Indicator -->
    <div class="steps-indicator">
        <div class="step-bubble completed"><i data-lucide="check" style="width: 1.1rem; height: 1.1rem; vertical-align: middle;"></i></div>
        <div class="step-bubble active">2</div>
        <div class="step-bubble">3</div>
        <div class="step-bubble">4</div>
    </div>
    
    <div class="card">
        <h2 class="card-title">
            <i data-lucide="graduation-cap" style="color: var(--primary);"></i>
            Step 2: Educational Information
        </h2>
        <p class="text-secondary" style="font-size: 0.9rem; margin-top: -1rem; margin-bottom: 2rem;">
            Provide details about the college, course, and educational level you are applying for.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="college_name">College / Institution Name</label>
                <input 
                    type="text" 
                    id="college_name"
                    name="college_name" 
                    class="form-control" 
                    value="{{ request.session.college_name|default:'' }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="course_name">Course / Program Name</label>
                <input 
                    type="text" 
                    id="course_name"
                    name="course_name" 
                    class="form-control" 
                    placeholder="e.g. B.Tech Computer Science, B.Sc Mathematics"
                    value="{{ request.session.course_name|default:'' }}" 
                    required
                >
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="academic_year">Academic Year</label>
                    <input 
                        type="text" 
                        id="academic_year"
                        name="academic_year" 
                        class="form-control" 
                        placeholder="e.g. 2026-2027"
                        value="{{ request.session.academic_year|default:'' }}" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="education_level">Current Education Level</label>
                    <input 
                        type="text" 
                        id="education_level"
                        name="education_level" 
                        class="form-control" 
                        placeholder="e.g. Undergraduate, Post-Graduate"
                        value="{{ request.session.education_level|default:'' }}" 
                        required
                    >
                </div>
            </div>

            <div class="form-actions">
                <a href="{% url 'admission_personal' %}" class="btn btn-outline" style="margin-right: auto;">
                    <i data-lucide="arrow-left"></i> Previous
                </a>
                <button type="submit" class="btn btn-primary">
                    Next Step <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
