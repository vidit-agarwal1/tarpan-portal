{% extends 'accounts/base.html' %}

{% block title %}Personal Details | Admission Form{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 650px; margin: 0 auto;">
    
    <!-- Progress Indicator -->
    <div class="steps-indicator">
        <div class="step-bubble active">1</div>
        <div class="step-bubble">2</div>
        <div class="step-bubble">3</div>
        <div class="step-bubble">4</div>
    </div>
    
    <div class="card">
        <h2 class="card-title">
            <i data-lucide="user" style="color: var(--primary);"></i>
            Step 1: Personal Information
        </h2>
        <p class="text-secondary" style="font-size: 0.9rem; margin-top: -1rem; margin-bottom: 2rem;">
            Please enter your accurate contact and demographic information.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name <span style = "color : red;">*</span></label>
                <input 
                    type="text" 
                    id="name"
                    name="name" 
                    class="form-control" 
                    value="{{ request.session.name|default:'' }}" 
                    required
                >
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="phone">Phone Number <span style = "color : red;">*</span></label>
                    <input 
                        type="tel" 
                        id="phone"
                        name="phone" 
                        class="form-control" 
                        value="{{ request.session.phone|default:'' }}" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="email">Email Address <span style = "color : red;">*</span> </label>
                    <input 
                        type="email" 
                        id="email"
                        name="email" 
                        class="form-control" 
                        value="{{ request.session.email|default:'' }}" 
                        required
                    >
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="gender">Gender <span style="color: red;">*</span></label>
                    <select
                        id="gender"
                        name="gender"
                        class="form-control"
                        required
                    >
                        <option value="" disabled {% if not request.session.gender %}selected{% endif %}>
                            — Select your gender —
                        </option>
                        <option value="Male" {% if request.session.gender == 'Male' %}selected{% endif %}>
                            Male
                        </option>
                        <option value="Female" {% if request.session.gender == 'Female' %}selected{% endif %}>
                            Female
                        </option>
                        <option value="Prefer not to say" {% if request.session.gender == 'Prefer not to say' %}selected{% endif %}>
                            Prefer not to say
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth <span style = "color : red;">*</span></label>
                    <input 
                        type="date" 
                        id="dob"
                        name="dob" 
                        class="form-control" 
                        value="{{ request.session.dob|default:'' }}" 
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="address">Permanent Address<span style = "color : red;">*</span></label>
                <textarea 
                    id="address"
                    name="address" 
                    class="form-control" 
                    required
                >{{ request.session.address|default:'' }}</textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="district">District <span style = "color : red;">*</span></label>
                    <input 
                        type="text" 
                        id="district"
                        name="district" 
                        class="form-control" 
                        value="{{ request.session.district|default:'' }}" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="category">
                        Category <span style="color: red;">*</span>
                    </label>
                    <select
                        id="category"
                        name="category"
                        class="form-control"
                        required
                    >
                        <option value="" disabled {% if not request.session.category %}selected{% endif %}>
                            — Select your category —
                        </option>
                        <option value="Complete Orphan" {% if request.session.category == 'Complete Orphan' %}selected{% endif %}>
                            Complete Orphan
                        </option>
                        <option value="Orphan with no parents, but has relatives" {% if request.session.category == 'Orphan with no parents, but has relatives' %}selected{% endif %}>
                            Orphan with no parents, but has relatives
                        </option>
                        <option value="Children with one parent" {% if request.session.category == 'Children with one parent' %}selected{% endif %}>
                            Children with one parent
                        </option>
                        <option value="Children of divorced parents" {% if request.session.category == 'Children of divorced parents' %}selected{% endif %}>
                            Children of divorced parents
                        </option>
                        <option value="Children of parents suffering from a serious illness" {% if request.session.category == 'Children of parents suffering from a serious illness' %}selected{% endif %}>
                            Children of parents suffering from a serious illness
                        </option>
                        <option value="Children under care and protection" {% if request.session.category == 'Children under care and protection' %}selected{% endif %}>
                            Children under care and protection
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-actions" style="justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">
                    Next Step <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
