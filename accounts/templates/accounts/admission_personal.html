{% extends 'accounts/base.html' %}

{% block title %}Personal Details | Admission Form{% endblock %}

{% block content %}
<div class="fade-in" style="max-width: 650px; margin: 0 auto;">
    
    <!-- Progress Indicator -->
    <div class="steps-indicator">
        <div class="step-bubble active">1</div>
        <div class="step-bubble">2</div>
        <div class="step-bubble">3</div>
        <div class="step-bubble">4</div>
    </div>
    
    <div class="card">
        <h2 class="card-title">
            <i data-lucide="user" style="color: var(--primary);"></i>
            Step 1: Personal Information
        </h2>
        <p class="text-secondary" style="font-size: 0.9rem; margin-top: -1rem; margin-bottom: 2rem;">
            Please enter your accurate contact and demographic information.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name"
                    name="name" 
                    class="form-control" 
                    value="{{ request.session.name|default:'' }}" 
                    required
                >
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone"
                        name="phone" 
                        class="form-control" 
                        value="{{ request.session.phone|default:'' }}" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email"
                        name="email" 
                        class="form-control" 
                        value="{{ request.session.email|default:'' }}" 
                        required
                    >
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <input 
                        type="text" 
                        id="gender"
                        name="gender" 
                        class="form-control" 
                        placeholder="e.g. Male, Female, Other"
                        value="{{ request.session.gender|default:'' }}" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input 
                        type="date" 
                        id="dob"
                        name="dob" 
                        class="form-control" 
                        value="{{ request.session.dob|default:'' }}" 
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="address">Permanent Address</label>
                <textarea 
                    id="address"
                    name="address" 
                    class="form-control" 
                    required
                >{{ request.session.address|default:'' }}</textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="district">District</label>
                    <input 
                        type="text" 
                        id="district"
                        name="district" 
                        class="form-control" 
                        value="{{ request.session.district|default:'' }}" 
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input 
                        type="text" 
                        id="category"
                        name="category" 
                        class="form-control" 
                        placeholder="e.g. General, OBC, SC, ST"
                        value="{{ request.session.category|default:'' }}" 
                        required
                    >
                </div>
            </div>

            <div class="form-actions" style="justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">
                    Next Step <i data-lucide="arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
